name: CI

# The four gates run locally today and would regress silently without this.
# Every gate is reproduced exactly as `npm run verify` runs them, plus the
# build, so a green run here means the same thing a green terminal does.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · format · test · build
    # Pinned rather than `ubuntu-latest`: the label migrates to Ubuntu 26 on
    # 2026-10-19, which would change the runner image under the gate without
    # any change to this repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # The database-backed tests are required, not optional. audit.test.ts and
    # app-wiring.test.ts throw when PostgreSQL is unreachable rather than
    # skipping, because a skipped database test is a broken gate — so this
    # service container is mandatory, not a convenience.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zyvora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Matches the application default, stated explicitly so CI cannot drift
      # from it silently.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zyvora
      NODE_ENV: test
      # Non-default so a test that accidentally depends on a dev secret fails
      # here rather than passing locally.
      JWT_SECRET: ci-secret-not-used-for-production-min-32-chars
      COOKIE_SECRET: ci-cookie-secret-not-used-in-production-32-chars

    steps:
      - name: Checkout
        # v5+, not v4: v4 targets the deprecated Node 20 action runtime.
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 24, not 20. Node 20 went end-of-life in April 2026 and the tree
          # no longer supports it: jsdom 30 depends on undici 8, whose engines
          # field requires Node >= 22.19.
          #
          # This was not caught by a red build at first. Under Node 20 vitest
          # loaded jsdom, undici threw while initialising, and the web suites
          # reported "3 test files" having run ZERO tests in 447ms. The run
          # only failed because vitest refuses to ignore unhandled errors —
          # had it not, CI would have shown a green frontend gate that verified
          # nothing at all.
          node-version: '24'
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Verify PostgreSQL is reachable
        run: |
          for i in $(seq 1 30); do
            if node -e "
              const {Client}=require('pg');
              const c=new Client({connectionString:process.env.DATABASE_URL});
              c.connect().then(()=>c.query('select 1')).then(()=>c.end())
               .then(()=>process.exit(0)).catch(()=>process.exit(1));
            " 2>/dev/null; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Apply migrations
        run: npm run migrate

      - name: Seed
        run: npm run seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # A suite that runs nothing must not be able to pass.
      #
      # This gate exists because one did. On Node 20 jsdom failed to initialise,
      # and vitest reported "Test Files (3)" — three files it had discovered —
      # while running ZERO tests in 447ms. The step only failed by accident,
      # because vitest treats the accompanying unhandled error as fatal. Had
      # that not happened, a green check would have stood in for a frontend
      # suite that verified nothing.
      #
      # So the counts are asserted, not inferred. Each runner must report at
      # least as many tests as it has cases, and zero fails outright.
      - name: Assert the test suites actually executed
        run: |
          set -euo pipefail
          # Re-run each workspace separately so the counts are attributable.
          # Cheap next to a false green.
          npm run test -w @zyvora/api  2>&1 | tee /tmp/api-tests.log
          npm run test -w @zyvora/web 2>&1 | tee /tmp/web-tests.log

          # Colour codes first. Vitest writes, uncoloured,
          #   Tests  23 passed (23)
          # but on a TTY it emits
          #   \e[2m Tests \e[22m \e[90m \e[2m23 passed\e[39m
          # so the number is separated from its label by escape sequences, not
          # spaces. Matching the raw output reads a healthy suite as zero --
          # a gate that fails when everything is fine is worse than none.
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/api-tests.log /tmp/web-tests.log

          # Node's runner prints the summary with an info glyph (U+2139) in the
          # default reporter and with '#' in strict TAP. Match both - a gate
          # that silently reads 0 because the prefix changed is worse than no
          # gate at all.
          api_ran=$(grep -aEo '^(#|.) tests [0-9]+' /tmp/api-tests.log | tail -1 | grep -Eo '[0-9]+$' || echo 0)
          api_passed=$(grep -aEo '^(#|.) pass [0-9]+' /tmp/api-tests.log | tail -1 | grep -Eo '[0-9]+$' || echo 0)
          api_failed=$(grep -aEo '^(#|.) fail [0-9]+' /tmp/api-tests.log | tail -1 | grep -Eo '[0-9]+$' || echo 0)
          web_passed=$(grep -aEo 'Tests +[0-9]+ passed' /tmp/web-tests.log | tail -1 | grep -Eo '[0-9]+' || echo 0)

          echo "API: ran=${api_ran} passed=${api_passed} failed=${api_failed}"
          echo "WEB: passed=${web_passed}"

          fail=0
          [ "$api_ran" -gt 0 ] || { echo "::error::API suite ran 0 tests"; fail=1; }
          [ "$web_passed" -gt 0 ] || { echo "::error::WEB suite ran 0 tests — the runner did not execute"; fail=1; }
          [ "$api_failed" -eq 0 ] || { echo "::error::API suite had ${api_failed} failures"; fail=1; }
          exit $fail

      - name: Build
        run: npm run build

      # A build that emits nothing is green, so assert the artifact exists.
      # This is the exact defect that made `npm run build` pass while dist/
      # stayed empty.
      - name: Assert build produced an API artifact
        run: |
          test -f apps/api/dist/index.js \
            || { echo "apps/api/dist/index.js missing — build emitted nothing"; exit 1; }
          echo "api artifact present"

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI"
            echo ""
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"